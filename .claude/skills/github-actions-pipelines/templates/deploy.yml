name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: ci
    runs-on: ubuntu-latest
    environment: dev          # the dev identity has AcrPush on the shared registry
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${{ vars.ACR_NAME }}"
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/support-backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: src/frontend
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/support-frontend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-dev:
    needs: build-push
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: dev
      tag: ${{ needs.build-push.outputs.tag }}

  deploy-test:
    needs: [build-push, deploy-dev]
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: test
      tag: ${{ needs.build-push.outputs.tag }}

  deploy-prod:
    needs: [build-push, deploy-test]
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: prod
      tag: ${{ needs.build-push.outputs.tag }}