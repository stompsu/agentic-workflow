name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; id-token is granted only on the jobs that run azure/login.
permissions:
  contents: read

# Pipeline runs are ordered; a newer run waits instead of cancelling a deploy in progress.
concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Build once per commit. Runs in the dev environment: the dev identity has AcrPush on the shared registry.
  build-push:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: src/backend
          file: src/backend/Dockerfile
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/support-backend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=support-backend
          cache-to: type=gha,mode=max,scope=support-backend
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/support-frontend:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=support-frontend
          cache-to: type=gha,mode=max,scope=support-frontend
      - name: Build and push ingestion
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/backend/Dockerfile.ingestion
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/support-ingestion:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=support-ingestion
          cache-to: type=gha,mode=max,scope=support-ingestion

  deploy-dev:
    needs: build-push
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: dev
      tag: ${{ needs.build-push.outputs.tag }}

  # Test: required reviewers. After the deploy it runs the managed-identity smoke job (ADR 0003 1a).
  deploy-test:
    needs: [build-push, deploy-dev]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: test
      tag: ${{ needs.build-push.outputs.tag }}
      run-mi-smoke: true

  # Prod gate: needs deploy-test, which includes the MI smoke job. Required reviewers.
  deploy-prod:
    needs: [build-push, deploy-test]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: prod
      tag: ${{ needs.build-push.outputs.tag }}
