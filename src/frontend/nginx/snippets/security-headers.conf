# Included in every location (add_header is not inherited once a location sets its own).
# connect-src/frame-src/form-action allow the Entra External ID tenant (<sub>.ciamlogin.com).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.ciamlogin.com https://login.microsoftonline.com; frame-src 'self' https://*.ciamlogin.com; form-action 'self' https://*.ciamlogin.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
