# Same as security-headers.conf but the redirect bridge may be framed by its own origin (MSAL silent iframe fallback).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.ciamlogin.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
