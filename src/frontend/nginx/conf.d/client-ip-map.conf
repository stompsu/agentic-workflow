# http context (conf.d is included by the image's nginx.conf outside any server block). Not a template: copied as is.
#
# $client_ip = the rightmost entry of X-Forwarded-For. The Azure Container Apps ingress appends the real client
# address as the last entry ("only the rightmost IP is provided by Azure Container Apps"); everything before it is
# client-controlled. Without a header the connection address is used. The backend uses the value only as a
# rate-limit key for guest creation (ADR 0006 section 9.4). It is set as a request header ONLY in `location /api/`.
map $http_x_forwarded_for $client_ip {
    "~(?<rightmost>[^,\s]+)\s*$" $rightmost;
    default                       $remote_addr;
}

# Access log format WITHOUT client addresses (G12, ADR 0006 section 10): no $remote_addr, no
# $http_x_forwarded_for, no $client_ip. Selected by `access_log` in the server block.
log_format no_client_ip '$time_iso8601 "$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '$request_time "$http_user_agent"';
