version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /src/backend
    schedule: { interval: weekly }
    groups:
      nuget:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/frontend
    schedule: { interval: weekly }
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /src/backend
    schedule: { interval: weekly }
    groups:
      docker-backend:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /src/frontend
    schedule: { interval: weekly }
    groups:
      docker-frontend:
        update-types: [minor, patch]
